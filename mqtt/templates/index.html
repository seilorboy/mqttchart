<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MQTT-mittausdata</title>
<style>
body{font:16px system-ui,sans-serif;margin:2rem auto;padding:0 1rem;max-width:1200px;background:#f4f7fa;color:#183047}
table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:12px;border-bottom:1px solid #dde4ea;vertical-align:top}
pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-width:650px}button{padding:8px 14px;cursor:pointer}.scroll{overflow-x:auto}#status{min-height:2em}
</style>
<script src="{{ url_for('static', filename='messages.js') }}" defer></script>
</head>
<body data-api-url="{{ url_for('messages') }}">
<p><a href="{{ url_for('index') }}">Aurinkosähkön kuvaajat</a></p>
<h1>MQTT-mittausdata</h1>
<p>Viimeiset 100 tallennettua viestiä. Näkymä päivittyy 5 sekunnin välein. Ajat näytetään selaimen aikavyöhykkeellä.</p>
<button id="refresh">Päivitä</button>
<p id="status" role="status">Ladataan…</p>
<div class="scroll"><table><thead><tr><th>Vastaanotettu</th><th>Topic</th><th>Viesti</th><th>QoS / retained</th></tr></thead><tbody id="messages"></tbody></table></div>
</body>
</html>
