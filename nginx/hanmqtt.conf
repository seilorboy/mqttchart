# Include INSIDE the existing hanmeter.duckdns.org HTTPS server block.
# Do not symlink this location-only snippet into sites-enabled.
location = /mqttchart {
    return 301 /mqttchart/;
}

location ^~ /mqttchart/ {
    # Trailing slash strips /mqttchart/ from the upstream request path.
    proxy_pass http://127.0.0.1:8083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mqttchart;
}
